name: Render slides

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Select which formats to build
env:
  EXPORT_HTML: true
  EXPORT_PDF: true
  EXPORT_PPTX: true

jobs:
  render:
    runs-on: ubuntu-24.04
    defaults:
      run:
        # Login shell so the conda env is activated in every step
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: quarto-slides
          miniforge-version: latest

      - name: Install TinyTeX
        if: env.EXPORT_PDF == 'true'
        run: quarto install tinytex --no-prompt

      - name: Render revealjs
        if: env.EXPORT_HTML == 'true'
        run: quarto render talk.qmd --to revealjs -M embed-resources:true

      - name: Render beamer
        if: env.EXPORT_PDF == 'true'
        run: quarto render talk.qmd --to beamer

      - name: Render pptx
        if: env.EXPORT_PPTX == 'true'
        run: quarto render talk.qmd --to pptx

      - uses: actions/upload-artifact@v4
        with:
          name: slides
          path: |
            talk.html
            talk.pdf
            talk.pptx
          if-no-files-found: error

      - name: Prepare Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          if [ -f talk.html ]; then cp talk.html _site/index.html; fi
          for f in talk.pdf talk.pptx; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          # Public bundle of all built outputs
          zip -j _site/slides.zip $(ls talk.html talk.pdf talk.pptx 2>/dev/null)

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    needs: render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
