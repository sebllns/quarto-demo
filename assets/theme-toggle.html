<style>
  html.dark {
    --r-background-color: #1e1e1e;
    --r-main-color: #e6e6e6;
    --r-heading-color: #f2f2f2;
    --r-link-color: #6cb6ff;
    --r-link-color-hover: #9ccfff;
    --r-selection-background-color: #3a5f8a;
  }
  html.dark body,
  html.dark .reveal-viewport {
    background-color: var(--r-background-color) !important;
  }
  html.dark .reveal,
  html.dark .reveal .slide-number {
    color: var(--r-main-color);
  }
  html.dark .reveal h1,
  html.dark .reveal h2,
  html.dark .reveal h3 {
    color: var(--r-heading-color);
  }
  html.dark .reveal a {
    color: var(--r-link-color);
  }
  html.dark .reveal div.sourceCode,
  html.dark .reveal pre code {
    background-color: #2b2b2b;
    color: #e6e6e6;
  }
  html.dark .reveal :not(pre) > code {
    background-color: #2b2b2b;
    color: #e6e6e6;
  }
  html.dark .reveal pre > code.sourceCode > span > a:first-child::before {
    color: #6e7681;
  }
  /* Pandoc token classes, GitHub dark palette */
  html.dark .reveal code span.kw,
  html.dark .reveal code span.cf,
  html.dark .reveal code span.pp { color: #ff7b72; }
  html.dark .reveal code span.dt,
  html.dark .reveal code span.bu,
  html.dark .reveal code span.im,
  html.dark .reveal code span.va { color: #ffa657; }
  html.dark .reveal code span.dv,
  html.dark .reveal code span.bn,
  html.dark .reveal code span.fl,
  html.dark .reveal code span.cn,
  html.dark .reveal code span.at { color: #79c0ff; }
  html.dark .reveal code span.st,
  html.dark .reveal code span.ch,
  html.dark .reveal code span.ss,
  html.dark .reveal code span.vs,
  html.dark .reveal code span.sc { color: #a5d6ff; }
  html.dark .reveal code span.co,
  html.dark .reveal code span.do,
  html.dark .reveal code span.cv,
  html.dark .reveal code span.an,
  html.dark .reveal code span.in,
  html.dark .reveal code span.wa { color: #8b949e; }
  html.dark .reveal code span.fu,
  html.dark .reveal code span.ex { color: #d2a8ff; }
  html.dark .reveal code span.op,
  html.dark .reveal code span.ot { color: #e6e6e6; }
  html.dark .reveal code span.al,
  html.dark .reveal code span.er { color: #f85149; }
  html.dark .reveal .callout {
    background-color: #262626;
  }
  #theme-toggle {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 100;
    padding: 4px 10px;
    font-size: 14px;
    border: 1px solid #888;
    border-radius: 4px;
    background: transparent;
    color: inherit;
    cursor: pointer;
  }
  html.dark #theme-toggle {
    color: #e6e6e6;
  }
  @media print {
    #theme-toggle { display: none; }
  }
</style>
<button id="theme-toggle" type="button" aria-label="Toggle dark mode">Dark</button>
<script>
  (function () {
    var root = document.documentElement;
    var btn = document.getElementById('theme-toggle');

    function apply(dark) {
      root.classList.toggle('dark', dark);
      btn.textContent = dark ? 'Light' : 'Dark';
    }

    var saved = null;
    try { saved = localStorage.getItem('slides-theme'); } catch (e) {}
    apply(saved === 'dark');

    btn.addEventListener('click', function () {
      var dark = !root.classList.contains('dark');
      apply(dark);
      try { localStorage.setItem('slides-theme', dark ? 'dark' : 'light'); } catch (e) {}
      // Release focus so Space/arrows keep driving reveal.js
      btn.blur();
    });
  })();
</script>
